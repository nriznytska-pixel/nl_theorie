<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rijtheorie NL — CBR 2025 🇳🇱</title>
<meta name="description" content="Подготовка к теоретическому экзамену CBR 2025/2026. NL/RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg1:#0a0e17;--bg2:#101829;--card:#141c2e;--card2:#1a2540;--orange:#f0a030;--orange2:#ffd98e;--green:#3cb371;--green2:#7defa0;--red:#e84040;--text:#e0e4ec;--dim:#8a90a0;--dimmer:#555;--radius:14px}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg1);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .2s}
button:active{transform:scale(.97)}
input{font-family:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a3550;border-radius:3px}
.header{background:linear-gradient(135deg,#f0a030,#e8941a);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px rgba(240,160,48,.25)}
.header h1{font-size:18px;font-weight:700;color:#111;letter-spacing:-.3px}
.header .sub{font-size:11px;color:#444;margin-top:1px}
.back-btn{background:rgba(0,0,0,.12);border-radius:8px;padding:7px 14px;color:#111;font-weight:600;font-size:13px}
.main{max-width:680px;margin:0 auto;padding:20px 14px 40px}
.welcome{background:linear-gradient(135deg,rgba(240,160,48,.08),rgba(240,160,48,.03));border:1px solid rgba(240,160,48,.12);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px}
.welcome h2{color:var(--orange2);font-size:17px;margin-bottom:6px}
.welcome p{color:var(--dim);font-size:13px;line-height:1.6}
.topic-btn{width:100%;background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:14px 18px;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:6px;transition:all .2s}
.topic-btn:hover{background:var(--card2);border-color:rgba(255,255,255,.1);transform:translateX(3px)}
.nav-btn{width:100%;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px;text-align:left;margin-top:10px;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.05)}
.section-label{color:#555;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin:18px 0 10px;font-weight:600}
.mode-tabs{display:flex;gap:4px;margin-bottom:20px;padding:3px;background:rgba(255,255,255,.025);border-radius:12px}
.mode-tab{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:500;color:#777;background:transparent;transition:all .25s}
.mode-tab.active{font-weight:700;color:#111}
.theory-card{background:rgba(255,255,255,.04);border-radius:var(--radius);padding:16px 20px;margin-bottom:8px;border-left:4px solid var(--orange);transition:all .2s}
.theory-card:hover{background:rgba(255,255,255,.06)}
.theory-nl{color:var(--orange2);font-size:15px;line-height:1.7}
.theory-ru{color:#b0b8c8;font-size:14px;line-height:1.6;margin-top:8px}
.flash-card{width:100%;max-width:540px;min-height:220px;border-radius:18px;padding:32px 28px;cursor:pointer;transition:all .35s ease;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-card.front{background:linear-gradient(135deg,var(--card2),#1d2b4a);border:2px solid #3a4560;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.flash-card.back{background:linear-gradient(135deg,#1b3a2a,#1a2f26);border:2px solid var(--green);box-shadow:0 0 40px rgba(60,179,113,.12)}
.quiz-option{width:100%;background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:12px;padding:12px 18px;color:var(--text);font-size:14px;text-align:left;transition:all .2s;margin-bottom:6px}
.quiz-option:hover:not(.disabled){background:rgba(255,255,255,.08)}
.quiz-option.correct{background:rgba(60,179,113,.2);border-color:var(--green)}
.quiz-option.wrong{background:rgba(220,60,60,.2);border-color:#dc3c3c}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.vocab-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:12px 16px;cursor:pointer;transition:all .2s}
.vocab-item:hover{background:rgba(255,255,255,.06)}
.vocab-item.open{background:rgba(60,179,113,.06);border-color:rgba(60,179,113,.2)}
.search-input{width:100%;padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid #2a3550;color:var(--text);font-size:15px;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--orange)}
.search-input::placeholder{color:#555}
.btn{background:var(--orange);color:#111;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600}
.btn.secondary{background:#3a4560;color:#ccc}
.btn.green{background:var(--green);color:#111}
.exam-box{background:rgba(240,160,48,.06);border:1px solid rgba(240,160,48,.12);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.signs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:16px 0}
.sign-card{background:rgba(255,255,255,.04);border-radius:12px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.06)}
.sign-card:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.sign-card .label{font-size:11px;color:#b0b8c8;text-align:center;line-height:1.4}
.sign-card .label-ru{font-size:10px;color:#777;text-align:center}
.sign-visual-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.footer{text-align:center;padding:20px;color:#222;font-size:11px}
@media(max-width:480px){.main{padding:14px 10px 30px}.flash-card{min-height:180px;padding:22px 18px}.vocab-grid{grid-template-columns:1fr}.signs-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
</style>
</head>

<script type="text/babel">
const { useState, useMemo } = React;
const h = React.createElement;

// ===== SVG TRAFFIC SIGNS =====
function Sign({type,text,size=56}){
  const s=size;
  const signs={

      h("rect",{x:18,y:42,width:64,height:16,rx:3,fill:"#fff"})),

      h("text",{x:50,y:60,textAnchor:"middle",fontSize:26,fontWeight:700,fill:"#fff"},"STOP")),
    // Verkeerslichten
    "lightRed": ()=>h("svg",{width:s*.6,height:s*1.3,viewBox:"0 0 40 90"},
      h("rect",{x:4,y:2,width:32,height:86,rx:6,fill:"#222"}),
      h("circle",{cx:20,cy:22,r:11,fill:"#ff2020"}),
      h("circle",{cx:20,cy:48,r:11,fill:"#553300"}),
      h("circle",{cx:20,cy:74,r:11,fill:"#224400"})),
    "lightYellow": ()=>h("svg",{width:s*.6,height:s*1.3,viewBox:"0 0 40 90"},
      h("rect",{x:4,y:2,width:32,height:86,rx:6,fill:"#222"}),
      h("circle",{cx:20,cy:22,r:11,fill:"#550000"}),
      h("circle",{cx:20,cy:48,r:11,fill:"#ffcc00"}),
      h("circle",{cx:20,cy:74,r:11,fill:"#224400"})),
    "lightGreen": ()=>h("svg",{width:s*.6,height:s*1.3,viewBox:"0 0 40 90"},
      h("rect",{x:4,y:2,width:32,height:86,rx:6,fill:"#222"}),

      h("circle",{cx:20,cy:48,r:11,fill:"#553300"}),
      h("circle",{cx:20,cy:74,r:11,fill:"#22cc22"})),

    "roundabout": ()=>h("svg",{width:s,height:s,viewBox:"0 0 100 100"},

    // Haaietanden visual
    "sharkTeeth": ()=>h("svg",{width:s*1.5,height:s*.5,viewBox:"0 0 150 40"},

      h("polygon",{points:"35,35 45,10 55,35",fill:"#fff"}),
      h("polygon",{points:"60,35 70,10 80,35",fill:"#fff"}),

      h("polygon",{points:"110,35 120,10 130,35",fill:"#fff"})),

    "gevarenDriehoek": ()=>h("svg",{width:s,height:s,viewBox:"0 0 100 100"},

    "dashedLine": ()=>h("svg",{width:s*1.5,height:s*.4,viewBox:"0 0 150 30"},

    // Woonerf
    "woonerf": ()=>h("svg",{width:s,height:s,viewBox:"0 0 100 100"},
      h("rect",{x:8,y:8,width:84,height:84,rx:8,fill:"#3366cc"}),
      h("polygon",{points:"30,60 50,38 70,60",fill:"#fff"}),
      h("rect",{x:38,y:54,width:24,height:18,fill:"#fff"}),
      h("circle",{cx:26,cy:72,r:6,fill:"#fff"}),

    // Tunnel
    "tunnel": ()=>h("svg",{width:s,height:s,viewBox:"0 0 100 100"},
      h("rect",{x:5,y:5,width:90,height:90,rx:8,fill:"#34495e"}),
      h("path",{d:"M20,80 Q20,30 50,25 Q80,30 80,80",fill:"#111"}),
      h("circle",{cx:50,cy:55,r:4,fill:"#ff0"}))
  };
  const render=signs[type];
  return render?render():h("span",null,"?");
}

function SignCard({type,labelNL,labelRU,size}){
  return h("div",{className:"sign-card"},
    h(Sign,{type,size:size||56}),
    h("div",{className:"label"},labelNL),
    labelRU&&h("div",{className:"label-ru"},labelRU)
  );
}

const T = [
{id:"verkeersregels",tNL:"Algemene verkeersregels",tRU:"Общие правила",icon:"📋",color:"#F7A828",
signs:["speed50","speed30","speed130","woonerf","sharkTeeth","solidLine","dashedLine"],
signLabels:["50 km/u\nбебком","30 km/u\nбебком","130 km/u\nснелвег","Woonerf\n15 km/u","Haaietanden\nУступи","Doorgetrokken\nСплошная","Onderbroken\nПрерывистая"],

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// ===== COMPONENTS =====
function SignsGallery({signs,labels}){
  if(!signs)return null;
  return h("div",null,
    h("div",{style:{color:"#8a90a0",fontSize:12,marginBottom:8,fontWeight:600}},"📌 Знаки этой темы / Borden"),
    h("div",{className:"signs-grid"},
      signs.map((s,i)=>{
        const lbl=(labels&&labels[i]||"").split("\n");
        return h("div",{key:i,className:"sign-card"},
          h(Sign,{type:s,size:52}),
          h("div",{className:"label"},lbl[0]||""),
          lbl[1]&&h("div",{className:"label-ru"},lbl[1])
        );
      })
    )
  );
}

function Theory({topic}){
  return h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    h(SignsGallery,{signs:topic.signs,labels:topic.signLabels}),
    topic.theory.map((item,i)=>h("div",{key:i,className:"theory-card",style:{borderLeftColor:topic.color}},
      h("div",{className:"theory-nl"},item.nl),
      h("div",{className:"theory-ru"},item.ru)
    ))
  );
}

function Cards({cards}){
  const[idx,setIdx]=useState(0);
  const[flip,setFlip]=useState(false);
  const[sh,setSh]=useState(()=>shuffle(cards));
  const c=sh[idx];
  return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:20}},
    h("div",{style:{color:"#8a90a0",fontSize:14}},idx+1+" / "+sh.length),
    h("div",{className:"flash-card "+(flip?"back":"front"),onClick:()=>setFlip(!flip)},
      !flip?h(React.Fragment,null,
        h("div",{style:{color:"#ffd98e",fontSize:17,textAlign:"center",lineHeight:1.7}},c.q),
        h("div",{style:{color:"#444",fontSize:12,marginTop:20}},"Нажмите / Klik")
      ):h("div",{style:{color:"#7defa0",fontSize:18,textAlign:"center",fontWeight:600,lineHeight:1.6}},c.a)
    ),
    h("div",{style:{display:"flex",gap:12}},
      h("button",{className:"btn",onClick:()=>{setIdx((idx-1+sh.length)%sh.length);setFlip(false)}},"←"),
      h("button",{className:"btn secondary",onClick:()=>{setSh(shuffle(cards));setIdx(0);setFlip(false)}},"🔀"),
      h("button",{className:"btn",onClick:()=>{setIdx((idx+1)%sh.length);setFlip(false)}},"→")
    )
  );
}

function Quiz({quiz}){
  const[qs]=useState(()=>shuffle(quiz));
  const[cur,setCur]=useState(0);const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);const[done,setDone]=useState(false);
  const q=qs[cur];
  const pick=(i)=>{if(sel!==null)return;setSel(i);if(i===q.c)setScore(s=>s+1);
    setTimeout(()=>{if(cur+1>=qs.length)setDone(true);else{setCur(c=>c+1);setSel(null)}},1100)};
  if(done){const pct=Math.round(score/qs.length*100);
    return h("div",{style:{textAlign:"center",padding:24}},
      h("div",{style:{fontSize:52}},pct>=88?"🎉":pct>=60?"💪":"📚"),
      h("div",{style:{color:"#ffd98e",fontSize:24,fontWeight:700}},score+"/"+qs.length+" ("+pct+"%)"),
      h("div",{style:{color:"#8a90a0",fontSize:13,margin:"4px 0 16px"}},"CBR: 88%"),
      h("button",{className:"btn",onClick:()=>{setCur(0);setSel(null);setScore(0);setDone(false)}},"🔄 Ещё раз"));}
  return h("div",{style:{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",width:"100%",maxWidth:540}},
      h("span",{style:{color:"#8a90a0",fontSize:13}},(cur+1)+"/"+qs.length),
      h("span",{style:{color:"#8a90a0",fontSize:12}},"✅"+score+" ❌"+(cur-score))),
    h("div",{className:"progress-bar",style:{maxWidth:540}},h("div",{className:"progress-fill",style:{width:((cur+1)/qs.length*100)+"%"}})),
    h("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"16px 20px",width:"100%",maxWidth:540}},
      h("div",{style:{color:"#ffd98e",fontSize:15}},q.q)),
    h("div",{style:{display:"flex",flexDirection:"column",gap:6,width:"100%",maxWidth:540}},
      q.o.map((opt,i)=>{let cls="quiz-option";if(sel!==null){if(i===q.c)cls+=" correct";else if(i===sel)cls+=" wrong";cls+=" disabled"}
        return h("button",{key:i,className:cls,onClick:()=>pick(i)},opt)})));
}

function Vocab(){
  const[fl,setFl]=useState({});const[f,setF]=useState("");
  const filt=V.filter(v=>v.nl.toLowerCase().includes(f.toLowerCase())||v.ru.toLowerCase().includes(f.toLowerCase()));
  return h("div",null,
    h("input",{className:"search-input",value:f,onChange:e=>setF(e.target.value),placeholder:"🔍 Zoeken / Поиск..."}),
    h("div",{style:{color:"#555",fontSize:12,margin:"10px 0"}},filt.length+" слов"),
    h("div",{className:"vocab-grid"},filt.map((v,i)=>h("div",{key:i,className:"vocab-item"+(fl[i]?" open":""),onClick:()=>setFl(p=>({...p,[i]:!p[i]}))},
      h("div",{style:{color:"#ffd98e",fontSize:15,fontWeight:500}},v.nl),fl[i]&&h("div",{style:{color:"#a0c8b4",fontSize:14,marginTop:6}},v.ru)))));
}

function FullExam(){
  const allQ=useMemo(()=>shuffle(T.flatMap(t=>t.quiz.map(q=>({...q,topic:t.tNL})))).slice(0,25),[]);
  const[cur,setCur]=useState(0);const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);const[done,setDone]=useState(false);const[wrongs,setWrongs]=useState({});
  const q=allQ[cur];
  const pick=(i)=>{if(sel!==null)return;setSel(i);if(i===q.c)setScore(s=>s+1);else setWrongs(w=>({...w,[q.topic]:(w[q.topic]||0)+1}));
    setTimeout(()=>{if(cur+1>=allQ.length)setDone(true);else{setCur(c=>c+1);setSel(null)}},1000)};
  if(done){const pct=Math.round(score/allQ.length*100);const weak=Object.entries(wrongs).sort((a,b)=>b[1]-a[1]);
    return h("div",{style:{textAlign:"center",padding:24}},
      h("div",{style:{fontSize:52}},pct>=88?"🎉":pct>=60?"💪":"📚"),
      h("div",{style:{color:"#ffd98e",fontSize:24,fontWeight:700}},score+"/"+allQ.length+" ("+pct+"%)"),
      h("div",{style:{color:"#8a90a0",fontSize:13,margin:"4px 0 16px"}},pct>=88?"Geslaagd! Сдан!":"Niet geslaagd. CBR: 88%"),
      weak.length>0&&h("div",{style:{margin:"16px auto",maxWidth:400,textAlign:"left"}},
        h("div",{style:{color:"#ff6b6b",fontSize:13,marginBottom:8}},"Слабые темы:"),
        weak.map(([t,n],i)=>h("div",{key:i,style:{color:"#b0b8c8",fontSize:13}},t+" — "+n))),
      h("button",{className:"btn",onClick:()=>{setCur(0);setSel(null);setScore(0);setDone(false);setWrongs({})}},"🔄 Ещё раз"));}
  return h("div",{style:{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",width:"100%",maxWidth:540}},
      h("span",{style:{color:"#8a90a0",fontSize:13}},(cur+1)+"/"+allQ.length),h("span",{style:{color:"#8a90a0",fontSize:12}},"✅"+score+" ❌"+(cur-score))),
    h("div",{className:"progress-bar",style:{maxWidth:540}},h("div",{className:"progress-fill",style:{width:((cur+1)/allQ.length*100)+"%"}})),
    h("div",{style:{color:"#444",fontSize:11}},q.topic),
    h("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"16px 20px",width:"100%",maxWidth:540}},h("div",{style:{color:"#ffd98e",fontSize:15}},q.q)),
    h("div",{style:{display:"flex",flexDirection:"column",gap:6,width:"100%",maxWidth:540}},
      q.o.map((opt,i)=>{let cls="quiz-option";if(sel!==null){if(i===q.c)cls+=" correct";else if(i===sel)cls+=" wrong";cls+=" disabled"}
        return h("button",{key:i,className:cls,onClick:()=>pick(i)},opt)})));
}
