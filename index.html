<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rijtheorie NL — CBR Theorie-examen 🇳🇱</title>
<meta name="description" content="Подготовка к теоретическому экзамену CBR. Двуязычный курс NL/RU.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0a0e17;--bg2:#101829;--bg3:#172036;
  --card:#141c2e;--card2:#1a2540;--card3:#1e2d4a;
  --orange:#f0a030;--orange2:#ffd98e;--green:#3cb371;--green2:#7defa0;
  --red:#e84040;--blue:#3498db;--text:#e0e4ec;--dim:#8a90a0;--dimmer:#555;
  --radius:14px;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg1);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .2s}
button:active{transform:scale(.97)}
input{font-family:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3550;border-radius:3px}

.header{
  background:linear-gradient(135deg,#f0a030,#e8941a);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 24px rgba(240,160,48,.25);
}
.header h1{font-size:18px;font-weight:700;color:#111;letter-spacing:-.3px}
.header .sub{font-size:11px;color:#444;margin-top:1px}
.back-btn{
  background:rgba(0,0,0,.12);border-radius:8px;padding:7px 14px;
  color:#111;font-weight:600;font-size:13px;
}
.main{max-width:680px;margin:0 auto;padding:20px 14px 40px}
.welcome{
  background:linear-gradient(135deg,rgba(240,160,48,.08),rgba(240,160,48,.03));
  border:1px solid rgba(240,160,48,.12);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:20px;
}
.welcome h2{color:var(--orange2);font-size:17px;margin-bottom:6px}
.welcome p{color:var(--dim);font-size:13px;line-height:1.6}

.topic-btn{
  width:100%;background:var(--card);border:1px solid rgba(255,255,255,.05);
  border-radius:13px;padding:14px 18px;display:flex;align-items:center;gap:14px;
  text-align:left;margin-bottom:6px;transition:all .2s;
}
.topic-btn:hover{background:var(--card2);border-color:rgba(255,255,255,.1);transform:translateX(3px)}
.topic-icon{font-size:24px;flex-shrink:0}
.topic-title{font-size:15px;font-weight:600}
.topic-sub{font-size:12px;color:#666;margin-top:2px}
.topic-stats{color:var(--dimmer);font-size:11px;margin-left:auto;text-align:right;white-space:nowrap}

.nav-btn{
  width:100%;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px;
  text-align:left;margin-top:10px;transition:all .2s;
}
.nav-btn:hover{background:rgba(255,255,255,.05)}
.nav-btn .icon{font-size:24px}
.nav-btn .label{font-size:15px;font-weight:600}
.nav-btn .desc{font-size:12px;color:#666;margin-top:1px}
.nav-btn .arrow{margin-left:auto;color:#444;font-size:18px}

.section-label{
  color:#555;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  margin:18px 0 10px;font-weight:600;
}

.mode-tabs{
  display:flex;gap:4px;margin-bottom:20px;padding:3px;
  background:rgba(255,255,255,.025);border-radius:12px;
}
.mode-tab{
  flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:500;
  color:#777;background:transparent;transition:all .25s;
}
.mode-tab.active{font-weight:700;color:#111}

.theory-card{
  background:rgba(255,255,255,.04);border-radius:var(--radius);
  padding:16px 20px;margin-bottom:8px;
  border-left:4px solid var(--orange);transition:all .2s;
}
.theory-card:hover{background:rgba(255,255,255,.06)}
.theory-nl{color:var(--orange2);font-size:15px;line-height:1.7}
.theory-ru{color:#b0b8c8;font-size:14px;line-height:1.6;margin-top:8px}

.flash-card{
  width:100%;max-width:540px;min-height:220px;border-radius:18px;
  padding:32px 28px;cursor:pointer;transition:all .35s ease;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.flash-card.front{
  background:linear-gradient(135deg,var(--card2),var(--card3));
  border:2px solid #3a4560;box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.flash-card.back{
  background:linear-gradient(135deg,#1b3a2a,#1a2f26);
  border:2px solid var(--green);box-shadow:0 0 40px rgba(60,179,113,.12);
}
.flash-hint{color:#444;font-size:12px;margin-top:20px}

.quiz-option{
  width:100%;background:rgba(255,255,255,.04);border:2px solid transparent;
  border-radius:12px;padding:12px 18px;color:var(--text);font-size:14px;
  text-align:left;transition:all .2s;margin-bottom:6px;
}
.quiz-option:hover:not(.disabled){background:rgba(255,255,255,.08)}
.quiz-option.correct{background:rgba(60,179,113,.2);border-color:var(--green)}
.quiz-option.wrong{background:rgba(220,60,60,.2);border-color:#dc3c3c}

.progress-bar{
  width:100%;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;
}
.progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s ease}

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.vocab-item{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:11px;padding:12px 16px;cursor:pointer;transition:all .2s;
}
.vocab-item:hover{background:rgba(255,255,255,.06)}
.vocab-item.open{background:rgba(60,179,113,.06);border-color:rgba(60,179,113,.2)}
.vocab-nl{color:var(--orange2);font-size:15px;font-weight:500}
.vocab-ru{color:#a0c8b4;font-size:14px;margin-top:6px}

.search-input{
  width:100%;padding:12px 18px;border-radius:12px;
  background:rgba(255,255,255,.05);border:2px solid #2a3550;
  color:var(--text);font-size:15px;outline:none;transition:border .2s;
}
.search-input:focus{border-color:var(--orange)}
.search-input::placeholder{color:#555}

.btn{
  background:var(--orange);color:#111;border-radius:10px;
  padding:10px 20px;font-size:14px;font-weight:600;
}
.btn.secondary{background:#3a4560;color:#ccc}
.btn.green{background:var(--green);color:#111}

.exam-box{
  background:rgba(240,160,48,.06);border:1px solid rgba(240,160,48,.12);
  border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;
}
.tip-box{
  background:rgba(255,255,255,.03);border-radius:var(--radius);
  padding:18px 22px;
}
.tip-item{color:#b0b8c8;font-size:14px;line-height:1.8;margin-bottom:4px}

.result-emoji{font-size:52px;margin-bottom:8px}
.result-score{color:var(--orange2);font-size:24px;font-weight:700}
.result-sub{color:var(--dim);font-size:13px;margin:4px 0 16px}

.footer{text-align:center;padding:20px;color:#222;font-size:11px}
@media(max-width:480px){
  .main{padding:14px 10px 30px}
  .flash-card{min-height:180px;padding:22px 18px}
  .vocab-grid{grid-template-columns:1fr}
}
</style>
</head>

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

      React.createElement("div",{className:"theory-nl"},item.nl),
      React.createElement("div",{className:"theory-ru"},item.ru)
    ))
  );
}

function Cards({cards}){

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:20}},
    React.createElement("div",{style:{color:"#8a90a0",fontSize:14}},idx+1+" / "+sh.length),
    React.createElement("div",{className:"flash-card "+(flip?"back":"front"),onClick:()=>setFlip(!flip)},

      React.createElement("button",{className:"btn",onClick:()=>{setIdx((idx+1)%sh.length);setFlip(false)}},"Далее →")
    )
  );
}

function Quiz({quiz,topicColor}){
  const[qs]=useState(()=>shuffle(quiz));
  const[cur,setCur]=useState(0);
  const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);
  const[done,setDone]=useState(false);
  const q=qs[cur];
  const pick=(i)=>{
    if(sel!==null)return;setSel(i);
    if(i===q.c)setScore(s=>s+1);
    setTimeout(()=>{
      if(cur+1>=qs.length)setDone(true);
      else{setCur(c=>c+1);setSel(null)}
    },1200);
  };
  if(done){
    const pct=Math.round(score/qs.length*100);
    return React.createElement("div",{style:{textAlign:"center",padding:24}},
      React.createElement("div",{className:"result-emoji"},pct>=88?"🎉":pct>=60?"💪":"📚"),
      React.createElement("div",{className:"result-score"},score+"/"+qs.length+" ("+pct+"%)"),
      React.createElement("div",{className:"result-sub"},"CBR: 88% нужно для сдачи"),
      React.createElement("button",{className:"btn",onClick:()=>{setCur(0);setSel(null);setScore(0);setDone(false)}},"🔄 Ещё раз / Opnieuw")
    );
  }
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",width:"100%",maxWidth:540,alignItems:"center"}},
      React.createElement("span",{style:{color:"#8a90a0",fontSize:13}},"Вопрос "+(cur+1)+"/"+qs.length),
      React.createElement("span",{style:{color:"#8a90a0",fontSize:12}},"✅"+score+" ❌"+(cur-score))
    ),
    React.createElement("div",{className:"progress-bar",style:{maxWidth:540}},
      React.createElement("div",{className:"progress-fill",style:{width:((cur+1)/qs.length*100)+"%"}})
    ),
    React.createElement("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"16px 20px",width:"100%",maxWidth:540}},
      React.createElement("div",{style:{color:"#ffd98e",fontSize:15}},q.q)
    ),
    React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:6,width:"100%",maxWidth:540}},
      q.o.map((opt,i)=>{
        let cls="quiz-option";
        if(sel!==null){if(i===q.c)cls+=" correct";else if(i===sel)cls+=" wrong";cls+=" disabled"}
        return React.createElement("button",{key:i,className:cls,onClick:()=>pick(i)},opt);
      })
    )
  );
}

function FullExam(){
  const allQ=useMemo(()=>{

  },[]);
  const[cur,setCur]=useState(0);
  const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);
  const[done,setDone]=useState(false);
  const[wrongs,setWrongs]=useState({});
  const q=allQ[cur];
  const pick=(i)=>{
    if(sel!==null)return;setSel(i);
    if(i===q.c)setScore(s=>s+1);
    else setWrongs(w=>({...w,[q.topic]:(w[q.topic]||0)+1}));
    setTimeout(()=>{
      if(cur+1>=allQ.length)setDone(true);
      else{setCur(c=>c+1);setSel(null)}
    },1000);
  };
  if(done){
    const pct=Math.round(score/allQ.length*100);
    const weak=Object.entries(wrongs).sort((a,b)=>b[1]-a[1]);
    return React.createElement("div",{style:{textAlign:"center",padding:24}},
      React.createElement("div",{className:"result-emoji"},pct>=88?"🎉":pct>=60?"💪":"📚"),
      React.createElement("div",{className:"result-score"},score+"/"+allQ.length+" ("+pct+"%)"),
      React.createElement("div",{className:"result-sub"},pct>=88?"Geslaagd! Сдан!":"Niet geslaagd. Не сдан. CBR: 88%"),
      weak.length>0&&React.createElement("div",{style:{margin:"16px auto",maxWidth:400,textAlign:"left"}},
        React.createElement("div",{style:{color:"#ff6b6b",fontSize:13,marginBottom:8}},"Слабые темы:"),
        weak.map(([t,n],i)=>React.createElement("div",{key:i,style:{color:"#b0b8c8",fontSize:13}},t+" — "+n+" ошибок"))
      ),
      React.createElement("button",{className:"btn",onClick:()=>{setCur(0);setSel(null);setScore(0);setDone(false);setWrongs({})}},"🔄 Ещё раз")
    );
  }
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",width:"100%",maxWidth:540}},
      React.createElement("span",{style:{color:"#8a90a0",fontSize:13}},"Вопрос "+(cur+1)+"/"+allQ.length),
      React.createElement("span",{style:{color:"#8a90a0",fontSize:12}},"✅"+score+" ❌"+(cur-score))
    ),
    React.createElement("div",{className:"progress-bar",style:{maxWidth:540}},
      React.createElement("div",{className:"progress-fill",style:{width:((cur+1)/allQ.length*100)+"%"}})
    ),
    React.createElement("div",{style:{color:"#444",fontSize:11}},q.topic),
    React.createElement("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"16px 20px",width:"100%",maxWidth:540}},
      React.createElement("div",{style:{color:"#ffd98e",fontSize:15}},q.q)
    ),
    React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:6,width:"100%",maxWidth:540}},
      q.o.map((opt,i)=>{
        let cls="quiz-option";
        if(sel!==null){if(i===q.c)cls+=" correct";else if(i===sel)cls+=" wrong";cls+=" disabled"}
        return React.createElement("button",{key:i,className:cls,onClick:()=>pick(i)},opt);
      })
    )
  );
}
